name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key file
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY_B64 }}" ]; then
            echo "Secret SSH_PRIVATE_KEY_B64 is empty"; exit 1
          fi
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          username: defoult
          port: 2471
          key_path: key.pem          
          script_stop: true
          timeout: 60s
          command_timeout: 15m
          debug: true
          script: |
            set -euxo pipefail
            systemctl is-active frpc || echo "frpc is not active (ok for CD)"
            cd /home/defoult/OIS
            bash -x ./deploy.sh
