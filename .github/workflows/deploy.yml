name: CD Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Assert SSH_PRIVATE_KEY is set
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY is empty or not visible"; exit 1;
          fi
          echo "✅ SSH_PRIVATE_KEY length: $(echo '${{ secrets.SSH_PRIVATE_KEY }}' | wc -c) bytes"
          echo '${{ secrets.SSH_PRIVATE_KEY }}' | head -n1

      - name: Write SSH key to file and test raw SSH
        run: |
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
          ssh -i key.pem -p 2471 -o StrictHostKeyChecking=no defoult@course.prafdin.ru 'echo "SSH OK from GHA"'

      - name: Deploy over SSH (appleboy with key_path)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          username: defoult
          port: 2471
          key_path: key.pem       
          script_stop: true
          timeout: 60s
          command_timeout: 10m
          debug: true
          script: |
            set -euxo pipefail
            echo "🔐 Login to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u defoult13 --password-stdin

            echo "🧹 Stop old container if exists"
            docker rm -f catty-reminders || true

            echo "⬇️ Pull latest image"
            docker pull ghcr.io/defoult13/catty-reminders-app:latest

            echo "🚀 Run new container"
            docker run -d --name catty-reminders -p 8181:8181 --restart=always ghcr.io/defoult13/catty-reminders-app:latest

            echo "✅ Deployment complete"
