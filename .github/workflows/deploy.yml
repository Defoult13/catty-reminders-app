name: CD Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Assert SSH_PRIVATE_KEY is set
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY is EMPTY or not visible to this job"; exit 1;
          else
            echo "✅ SSH_PRIVATE_KEY length: $(echo "${{ secrets.SSH_PRIVATE_KEY }}" | wc -c) bytes"
            head -n 1 <<<'${{ secrets.SSH_PRIVATE_KEY }}'   # покажем только 1 строку (BEGIN)
          fi

      - name: Try raw SSH using the secret (bypass appleboy)
        run: |
          set -euo pipefail
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
          ssh -i key.pem -p 2471 -o StrictHostKeyChecking=no defoult@course.prafdin.ru 'echo "GHA can connect"'

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          username: defoult
          port: 2471
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euxo pipefail
            echo "🔄 Pull latest image from GHCR"
            docker login ghcr.io -u defoult13 -p ${{ secrets.GHCR_TOKEN }}
            docker pull ghcr.io/defoult13/catty-reminders-app:latest || true

            echo "🧹 Stop and remove old container if exists"
            docker rm -f catty-reminders || true

            echo "🚀 Run new container"
            docker run -d --name catty-reminders -p 8181:8181 ghcr.io/defoult13/catty-reminders-app:latest

            echo "✅ Deployment complete"
