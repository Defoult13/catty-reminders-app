name: CD Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Assert SSH_PRIVATE_KEY is set
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY is EMPTY or not visible to this job"; exit 1;
          else
            echo "✅ SSH_PRIVATE_KEY length: $(echo "${{ secrets.SSH_PRIVATE_KEY }}" | wc -c) bytes"
            head -n 1 <<<'${{ secrets.SSH_PRIVATE_KEY }}'
          fi

      - name: Install SSH key (ssh-agent)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add target host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2471 course.prafdin.ru >> ~/.ssh/known_hosts || true

      - name: Deploy over raw SSH
        run: |
          ssh -p 2471 defoult@course.prafdin.ru 'bash -lc "
            set -euo pipefail
            echo \"🔐 Login GHCR\"
            echo ${GHCR_TOKEN} | docker login ghcr.io -u ${GHCR_USER} --password-stdin

            echo \"🧹 Stop old container if exists\"
            docker rm -f catty-reminders || true

            echo \"⬇️ Pull latest image\"
            docker pull ghcr.io/defoult13/catty-reminders-app:latest

            echo \"🚀 Run new container\"
            docker run -d --name catty-reminders -p 8181:8181 --restart=always ghcr.io/defoult13/catty-reminders-app:latest

            echo \"✅ Done\"
          "'
        env:
          GHCR_USER: defoult13
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
