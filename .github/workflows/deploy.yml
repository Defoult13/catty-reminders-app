name: CD - Deploy Docker container

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          username: defoult
          port: 2471
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -eux
            docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} -p ${{ secrets.GHCR_TOKEN }}
            docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/catty-reminders:latest
            docker stop catty-reminders || true
            docker rm catty-reminders || true
            docker run -d --name catty-reminders -p 8181:8181 ghcr.io/${{ secrets.GHCR_USERNAME }}/catty-reminders:latest
