name: CI - build & test & push image

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    # Поднимаем MySQL как сервис для интеграционных тестов
    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: cattydb
          MYSQL_USER: catty
          MYSQL_PASSWORD: cattypass
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s --health-timeout=5s --health-retries=30

    env:
      # Эти переменные использует приложение для подключения к БД
      APP_ENV: production
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: catty
      MYSQL_PASSWORD: cattypass
      MYSQL_DATABASE: cattydb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create venv & install python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      # Ставим браузеры Playwright (и системные зависимости)
      - name: Install Playwright browsers
        run: |
          source .venv/bin/activate
          python -m playwright install --with-deps

      # Ждем готовности MySQL (service уже поднят, просто подстрахуемся)
      - name: Wait for MySQL to accept TCP
        shell: bash
        run: |
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1; then
              echo "MySQL is accepting connections"; exit 0
            fi
            echo "Waiting MySQL ($i/60)..."
            sleep 2
          done
          echo "MySQL didn't become ready in time"; exit 1

      # Стартуем приложение локально — оно само создаст БД/таблицы (у тебя это есть в MySQLStorage)
      - name: Start app (uvicorn) in background
        env:
          APP_ENV: ${{ env.APP_ENV }}
          MYSQL_HOST: ${{ env.MYSQL_HOST }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
        run: |
          source .venv/bin/activate
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 > uvicorn.log 2>&1 &

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8181/ >/dev/null; then
              echo "app ready"
              exit 0
            fi
            echo "waiting app ($i/60)..."
            sleep 1
          done
          echo "app did not start" >&2
          cat uvicorn.log || true
          exit 1

      - name: Run tests
        env:
          BASE_URL: http://127.0.0.1:8181
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source .venv/bin/activate
          pytest -q

      # Ниже — твоя сборка/публикация образа (оставляю как у тебя было)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create lowercase IMAGE_NAME and set IMAGE_TAG
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${OWNER_LOWER}/catty-reminders-app" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
